name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify module imports
        run: |
          python -c "import ai_testing_agent; print('ai_testing_agent OK')"
          python -c "import cli; print('cli OK')"
          python -c "import spec_ingestion; print('spec_ingestion OK')"
          python -c "import failure_analyzer; print('failure_analyzer OK')"
          python -c "import request_body_handler; print('request_body_handler OK')"
          python -c "import auth_handler; print('auth_handler OK')"
          python -c "import code_analyzer; print('code_analyzer OK')"
          python -c "import env_manager; print('env_manager OK')"
          python -c "import analytics; print('analytics OK')"
          python -c "import data_manager; print('data_manager OK')"
          python -c "import compliance; print('compliance OK')"
          python -c "import chain_detector; print('chain_detector OK')"
          python -c "import chain_test_generator; print('chain_test_generator OK')"

      - name: Run tests
        run: |
          python -m pytest \
            test_ai_routing.py \
            test_analytics.py \
            test_usage_tracking.py \
            test_spec_ingestion.py \
            test_failure_analyzer.py \
            test_compliance.py \
            test_chain_detector.py \
            test_execute_tests.py \
            test_traceability.py \
            test_validation_check.py \
            test_app_audit.py \
            test_data_access.py \
            test_shapes.py \
            test_requirements_audit.py \
            test_model_backend.py \
            test_permissions.py \
            test_audit_diff.py \
            test_full_report.py \
            -v --tb=short

  browser:
    # The browser check runs a real Chromium against a small local site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and a browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser tests
        env:
          AI_AGENT_TELEMETRY: "false"
        run: |
          python -m pytest test_browser_audit.py -v --tb=short -rs
          # A skip here would mean the browser did not start: fail instead of passing quietly.
          python -m pytest test_browser_audit.py -q -rs | tee result.txt
          ! grep -q "skipped" result.txt
