openapi: 3.0.3
info: {title: Orders API (demo), version: "1.0"}
paths:
  /api/orders:
    get: {operationId: listOrders, responses: {"200": {description: ok}}}
    post: {operationId: createOrder, responses: {"201": {description: created}}}
  /api/orders/{orderId}:
    get: {operationId: getOrder, responses: {"200": {description: ok}}}
    delete:
      operationId: deleteOrder
      security: [{bearerAuth: []}]
      responses: {"204": {description: deleted}}
  /api/orders/{orderId}/invoice:
    get: {operationId: getInvoice, responses: {"200": {description: ok}}}
